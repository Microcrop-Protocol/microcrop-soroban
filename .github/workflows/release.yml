# SEP-55 verified builds: one GitHub release + build attestation per contract, on a version tag.
#
# Push a tag `vX.Y.Z` on the commit to release. For each of the four contracts the reusable
# stellar-expert/soroban-build-workflow checks out that tagged commit, runs
# `stellar contract build --optimize --package <crate> --meta source_repo=github:<this repo>`,
# creates a release named `vX.Y.Z_<crate>_pkg<crate-version>_cli<cli-version>` with the WASM
# attached, registers the build with stellar.expert, and attests that same file
# (actions/attest-build-provenance). Deploy THOSE assets: scripts/deploy.sh --release vX.Y.Z.
#
# PIN. The reusable workflow is pinned to the commit of its latest release, resolved and
# reviewed on 2026-10-19:
#   gh release view --repo stellar-expert/soroban-build-workflow   -> v25.1.0
#   gh api repos/stellar-expert/soroban-build-workflow/commits/v25.1.0 --jq .sha
#                                                                  -> e43b241f114bcf02151c30d61088506c6ad3ae0b
#   release.yml read AT THAT SHA: checks out the tagged commit (actions/checkout, no ref ->
#   github.sha of this tag push), builds from source with stellar-cli 25.1.0, uploads
#   $OUTPUT/$WASM_FILE_NAME and attests the same $OUTPUT/$WASM_FILE_NAME.
# To bump: repeat those three steps, read the new release.yml at the new SHA, update the SHA
# below AND the signer digest list in scripts/lib/release.sh (old releases keep verifying
# against the old digest).
#
# RESIDUAL RISK. The SHA freezes release.yml only. The actions it calls sit on mutable tags
# (actions/checkout@v4, stellar/stellar-cli@v25.1.0, actions/setup-node@v4,
# actions/attest-build-provenance@v1) and resolve at run time with this job's token, OIDC and
# attestation permissions; a caller cannot pin them. Fork the workflow if that is unacceptable.
#
# NOT RELEASED: crates/testnet-policy-fixture (testnet evidence only) and the non-contract
# crates (shared, integration-tests). There is no job for them; keep it that way.
#
# home_domain is not set: MicroCrop has no SEP-1 stellar.toml yet. Add `home_domain: <domain>`
# to `with:` once one is served (bare domain, no scheme or path).
name: Build and Release

on:
  push:
    tags:
      - "v*"
      # The reusable workflow creates one extra tag per contract (vX.Y.Z_<crate>_..._cli...).
      # Tags created with GITHUB_TOKEN do not trigger workflows, but exclude them anyway so a
      # switch to a PAT can never make this workflow re-trigger itself.
      - "!v*_*"

# Inherited by the called workflow, which cannot elevate them.
permissions:
  contents: write     # create the release, attach the WASM
  id-token: write     # sign the attestation (Sigstore via GitHub OIDC)
  attestations: write # publish it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs before anything with write permissions. The reusable workflow pastes release_name
  # (the tag) straight into shell commands, and git allows `$(`, `)` and backticks in tag
  # names, so only a plain semver tag gets through. And a verified build of unreviewed code
  # proves nothing useful: the tagged commit must already be on master.
  guard:
    name: tag is semver and on master
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA (tag $TAG) is not on master. Merge first, then tag."
            exit 1
          fi
          echo "releasing $TAG from $GITHUB_SHA"

  release:
    name: release ${{ matrix.package }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        package:
          - microcrop-policy-nft
          - microcrop-policy-manager
          - microcrop-settlement-adapter
          - microcrop-payout-receiver
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      release_description: >-
        SEP-55 verified build of ${{ matrix.package }} from ${{ github.repository }}@${{ github.sha }}
        (tag ${{ github.ref_name }}). Verify before deploying:
        gh attestation verify <file> --repo ${{ github.repository }}
        --signer-workflow stellar-expert/soroban-build-workflow/.github/workflows/release.yml
        --source-ref ${{ github.ref }}
      package: ${{ matrix.package }}
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }} # created by GitHub, nothing to configure
